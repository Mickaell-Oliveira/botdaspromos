name: Robô do Telegram

on:
  schedule:
    # Executa a cada 30 minutos em minutos fora de pico (12 e 42) para evitar a fila congestionada do GitHub
    - cron: '12,42 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  executar-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID || '5096433671' }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@OBugdasPromos' }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar FFmpeg e Fontes (Para Reels e Artes)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar bibliotecas Python
        run: pip install gspread google-auth google-genai requests feedparser beautifulsoup4 cloudscraper Pillow edge-tts

      - name: 1. Caçar Novas Ofertas da Amazon (Hunter)
        continue-on-error: true
        run: python hunter_promos.py

      - name: 2. Postar no Canal do Telegram (Publisher)
        continue-on-error: true
        run: python bot_promos_sheets.py

      - name: 3. Gerar Fotos/Reels e Checar Aprovações (Instagram Manager)
        continue-on-error: true
        run: |
          python -c "p='insta_manager.py'; txt=open(p).read().replace('\u00a0',' ').replace('\t','    '); open(p,'w').write(txt)"
          python insta_manager.py

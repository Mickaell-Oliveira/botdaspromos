name: Robô do Telegram

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  executar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
        
      - name: Configurar o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar bibliotecas
        run: pip install gspread google-auth google-genai requests feedparser beautifulsoup4 cloudscraper
        
      - name: 1. Caçar Ofertas (Hunter)
        run: python hunter_promos.py
        
      - name: 2. Postar no Telegram (Publisher)
        run: python bot_promos_sheets.py
